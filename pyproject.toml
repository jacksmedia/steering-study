[project]
name = "steering"
version = "0.1.0"
description = "Is single-neuron steering specific? A controlled replication of a viral steering card."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
